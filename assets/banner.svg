<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #f3e8ff; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatFast {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-18px) scale(1.02); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }

      .animated-bg-element1 { animation: floatSlow 8s ease-in-out infinite; }
      .animated-bg-element2 { animation: floatFast 6s ease-in-out infinite; }
      .glow { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)"/>
  <rect width="1200" height="350" fill="url(#grid)"/>

  <!-- Background Animated Graphics (Low Opacity, Behind Text) -->
  <g opacity="0.4" class="animated-bg-element1">
    <!-- Graph & Nodes in Background Right -->
    <path d="M 750 240 Q 850 120 950 200 T 1150 100" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-dasharray="6,6"/>
    <circle cx="750" cy="240" r="8" fill="#6366f1"/>
    <circle cx="880" cy="165" r="10" fill="#a855f7"/>
    <circle cx="950" cy="200" r="6" fill="#ec4899"/>
    <circle cx="1150" cy="100" r="12" fill="#6366f1"/>
  </g>

  <g opacity="0.25" class="animated-bg-element2">
    <!-- Dynamic Cards / Pill Shapes -->
    <rect x="820" y="60" width="180" height="70" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="940" y="160" width="200" height="80" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="720" y="180" width="160" height="60" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2"/>
  </g>

  <!-- Glowing accent lights -->
  <circle cx="200" cy="80" r="150" fill="#6366f1" opacity="0.15" class="glow" filter="blur(40px)"/>
  <circle cx="1000" cy="250" r="180" fill="#ec4899" opacity="0.15" class="glow" filter="blur(50px)"/>

  <!-- Foreground Content (Always Crisp & Visible) -->
  <!-- Header Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="270" height="34" rx="17" fill="url(#accent-grad)" opacity="0.9"/>
    <text x="135" y="22" text-anchor="middle" class="badge-text">⚡ CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Title -->
  <text x="80" y="145" class="title">Awesome Foundation Model Platform 🚀</text>

  <!-- Subtitle -->
  <text x="80" y="195" class="subtitle">The definitive guide to LLM Inference, Fine-Tuning, Model Serving &amp; GPU Cloud Platforms.</text>
  <text x="80" y="225" class="subtitle" font-size="16px" fill="#94a3b8">Covering top SaaS providers, serverless endpoints, and high-performance open-source engines.</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 265)">
    <!-- Pill 1 -->
    <g transform="translate(0,0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#38bdf8" font-weight="600">🏢 SaaS Ecosystem</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195,0)">
      <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="95" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#a78bfa" font-weight="600">🔥 Open-Source Engines</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(397,0)">
      <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="95" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#f472b6" font-weight="600">📊 Market Benchmarks</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#accent-grad)"/>
</svg>
